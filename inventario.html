<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario — CEDIS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .stats-grid-inv {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .stat-card-inv {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      text-align: center;
    }

    .stat-card-inv .num {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-card-inv .lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .inv-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .inv-table th {
      text-align: left;
      padding: 0.6rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-muted);
      background: var(--bg);
      border-bottom: 2px solid var(--border);
    }

    .inv-table td {
      padding: 0.6rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .badge-stock {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      display: inline-block;
    }

    .stock-ok { background: #dcfce7; color: #15803d; }
    .stock-warn { background: #fef9c3; color: #854d0e; }
    .stock-empty { background: #fee2e2; color: #b91c1c; }
  </style>
</head>

<body>
  <nav class="navbar">
    <a href="index.html">←</a>
    <h1>📦 Inventario Físico</h1>
    <span></span>
  </nav>

  <div class="container has-bottom-nav">

    <!-- RESUMEN FINANCIERO -->
    <div class="stats-grid-inv">
      <div class="stat-card-inv" style="border-top: 4px solid var(--success);">
        <div class="num" id="total-dinero-inv" style="color:var(--success)">$0.00</div>
        <div class="lbl">Capital en Stock</div>
      </div>
      <div class="stat-card-inv" style="border-top: 4px solid var(--primary);">
        <div class="num" id="total-kg-inv">0 kg</div>
        <div class="lbl">Kilos Totales</div>
      </div>
      <div class="stat-card-inv">
        <div class="num" id="total-prods-inv">0</div>
        <div class="lbl">Productos Registrados</div>
      </div>
      <div class="stat-card-inv">
        <div class="num" id="total-criticos-inv" style="color:var(--danger)">0</div>
        <div class="lbl">Sin Stock (0g)</div>
      </div>
    </div>

    <!-- PANEL DE ENTRADA / CONTEO RÁPIDO -->
    <div class="card">
      <div class="card-title">Ajuste de Existencias / Conteo</div>
      
      <div style="display:flex; gap:0.5rem; margin-bottom:0.75rem">
        <div class="search-wrap" style="flex:1; margin:0">
          <span class="icon">🔍</span>
          <input type="text" id="busqueda-prod" placeholder="Buscar por nombre o código..." oninput="buscarProducto()" autocomplete="off">
        </div>
        <button class="btn btn-primary" onclick="encenderEscanner()" style="padding:0 1rem; border-radius:8px">📷</button>
      </div>

      <div id="scanner-container" style="display:none; margin-bottom:1rem;">
        <div id="reader" style="width:100%; border-radius:12px; overflow:hidden; border:2px solid var(--primary);"></div>
        <button class="btn btn-outline" onclick="apagarEscanner()" style="width:100%; margin-top:0.5rem">Cancelar Escaneo</button>
      </div>

      <div id="sugerencias-prod" style="display:none; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:0.75rem; background:white;"></div>

      <div id="panel-edicion-stock" style="display:none; background:var(--bg); border-radius:8px; padding:0.85rem; border-left:4px solid var(--primary);">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.5rem">
          <div>
            <div id="ed-nombre" style="font-weight:700; color:var(--primary); font-size:1rem"></div>
            <div id="ed-sub" style="font-size:0.75rem; color:var(--text-muted)"></div>
          </div>
          <button onclick="cancelarEdicion()" style="background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--text-muted)">✕</button>
        </div>

        <div style="font-size:0.82rem; margin-bottom:0.5rem">
          Existencia actual: <strong id="ed-stock-actual">0g</strong>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; margin-bottom:0.5rem">
          <div class="field" style="margin:0">
            <label>Cantidad</label>
            <input type="number" id="in-cantidad" step="any" placeholder="Ej: 25">
          </div>
          <div class="field" style="margin:0">
            <label>Unidad</label>
            <select id="in-unidad">
              <option value="kg">Kilos (kg)</option>
              <option value="g">Gramos (g)</option>
            </select>
          </div>
        </div>

        <div class="field" style="margin-bottom:0.75rem">
          <label>Modo de Conteo</label>
          <select id="in-modo">
            <option value="set">Reemplazar inventario (Conteo físico total)</option>
            <option value="add">Sumar a lo existente (Entrada / Nuevo costal)</option>
          </select>
        </div>

        <button class="btn btn-primary btn-block" onclick="guardarAjusteStock()">💾 Actualizar Stock</button>
      </div>
    </div>

    <!-- LISTA GENERAL DE STOCK -->
    <div class="card" style="padding:0; overflow:hidden">
      <div style="padding:0.85rem 1rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
        <div class="card-title" style="margin:0">Detalle de Existencias</div>
        <div style="font-size:0.75rem; color:var(--text-muted)" id="conteo-filtrados"></div>
      </div>
      
      <div style="overflow-x:auto">
        <table class="inv-table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Stock</th>
              <th>Valor ($)</th>
              <th style="width:40px"></th>
            </tr>
          </thead>
          <tbody id="tbody-inventario">
            <tr><td colspan="4" style="text-align:center; padding:1.5rem"><div class="spinner"></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon">🏠</span> Inicio</a>
    <a href="inventario.html" class="active"><span class="icon">📦</span> Stock</a>
    <a href="CEDIS.html"><span class="icon">🧮</span> CEDIS</a>
    <a href="catalogo.html"><span class="icon">📋</span> Catálogo</a>
    <a href="etiquetas.html"><span class="icon">🏷️</span> Etiquetas</a>
  </nav>

  <script src="supabase.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script>
    let productos = [];
    let productoSeleccionado = null;
    let html5QrCode = null;

    async function init() {
      await cargarCatalogoEInventario();
    }

    async function cargarCatalogoEInventario() {
      try {
        productos = await dbGet('productos', 'select=*,tipos_producto(nombre)&order=nombre.asc');
        actualizarMetricasFinancieras();
        renderTablaInventario(productos);
      } catch (e) {
        document.getElementById('tbody-inventario').innerHTML = 
          `<tr><td colspan="4"><div class="alert alert-error">${e.message}</div></td></tr>`;
      }
    }

    function actualizarMetricasFinancieras() {
      let totalDinero = 0;
      let totalGramos = 0;
      let sinStock = 0;

      productos.forEach(p => {
        const stockG = parseFloat(p.stock_gramos) || 0;
        totalGramos += stockG;

        if (stockG <= 0) sinStock++;

        const cpg = costoPorGramo(p);
        if (cpg && stockG > 0) {
          totalDinero += (stockG * cpg);
        }
      });

      document.getElementById('total-dinero-inv').textContent = formatPeso(totalDinero);
      document.getElementById('total-kg-inv').textContent = `${(totalGramos / 1000).toFixed(1)} kg`;
      document.getElementById('total-prods-inv').textContent = productos.length;
      document.getElementById('total-criticos-inv').textContent = sinStock;
      document.getElementById('conteo-filtrados').textContent = `${productos.length} productos`;
    }

    function renderTablaInventario(lista) {
      const tbody = document.getElementById('tbody-inventario');
      if (!lista.length) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:1.5rem; color:var(--text-muted)">Sin productos encontrados</td></tr>`;
        return;
      }

      tbody.innerHTML = lista.map(p => {
        const stockG = parseFloat(p.stock_gramos) || 0;
        const cpg = costoPorGramo(p);
        const valorTotal = cpg ? (stockG * cpg) : 0;

        let claseStock = 'stock-ok';
        if (stockG === 0) claseStock = 'stock-empty';
        else if (stockG < 1000) claseStock = 'stock-warn';

        const textoStock = stockG >= 1000 
          ? `${(stockG / 1000).toFixed(2)} kg` 
          : `${stockG} g`;

        return `
          <tr onclick="cargarParaEditar(${p.id})" style="cursor:pointer">
            <td>
              <div style="font-weight:600; font-size:0.85rem">${p.nombre}</div>
              <div style="font-size:0.7rem; color:var(--text-muted)">Cod: ${p.codigo} · ${p.tipos_producto?.nombre || ''}</div>
            </td>
            <td>
              <span class="badge-stock ${claseStock}">${textoStock}</span>
            </td>
            <td style="font-weight:700; color:var(--text)">
              ${cpg ? formatPeso(valorTotal) : '<small style="color:#dc2626">Sin costo</small>'}
            </td>
            <td style="text-align:right; color:var(--primary); font-size:1.1rem">›</td>
          </tr>
        `;
      }).join('');
    }

    // --- BÚSQUEDA Y SELECCIÓN ---
    function buscarProducto() {
      const q = document.getElementById('busqueda-prod').value.trim().toLowerCase();
      const sug = document.getElementById('sugerencias-prod');

      if (q.length < 2) {
        sug.style.display = 'none';
        renderTablaInventario(productos);
        return;
      }

      const filtrados = productos.filter(p => 
        p.nombre.toLowerCase().includes(q) || String(p.codigo).includes(q)
      );

      sug.innerHTML = filtrados.slice(0, 5).map(p => `
        <div style="padding:0.7rem 1rem; border-bottom:1px solid var(--border); cursor:pointer" onclick="cargarParaEditar(${p.id})">
          <div style="font-weight:600; font-size:0.88rem">${p.nombre}</div>
          <div style="font-size:0.72rem; color:var(--text-muted)">Código: ${p.codigo} · Stock: ${p.stock_gramos || 0}g</div>
        </div>
      `).join('');
      sug.style.display = filtrados.length ? 'block' : 'none';

      renderTablaInventario(filtrados);
    }

    function cargarParaEditar(id) {
      const p = productos.find(x => x.id === id);
      if (!p) return;

      productoSeleccionado = p;
      document.getElementById('sugerencias-prod').style.display = 'none';
      document.getElementById('busqueda-prod').value = p.nombre;

      document.getElementById('ed-nombre').textContent = p.nombre;
      document.getElementById('ed-sub').textContent = `Código: ${p.codigo} | Categoría: ${p.tipos_producto?.nombre || 'General'}`;

      const stockActual = parseFloat(p.stock_gramos) || 0;
      const formatActual = stockActual >= 1000 
        ? `${(stockActual / 1000).toFixed(2)} kg (${stockActual} g)`
        : `${stockActual} g`;

      document.getElementById('ed-stock-actual').textContent = formatActual;
      document.getElementById('in-cantidad').value = '';
      document.getElementById('panel-edicion-stock').style.display = 'block';
    }

    function cancelarEdicion() {
      productoSeleccionado = null;
      document.getElementById('panel-edicion-stock').style.display = 'none';
      document.getElementById('busqueda-prod').value = '';
      renderTablaInventario(productos);
    }

    async function guardarAjusteStock() {
      if (!productoSeleccionado) return;

      const rawCantidad = parseFloat(document.getElementById('in-cantidad').value);
      if (isNaN(rawCantidad) || rawCantidad < 0) {
        alert("Ingresa una cantidad válida mayor o igual a 0.");
        return;
      }

      const unidad = document.getElementById('in-unidad').value;
      const modo = document.getElementById('in-modo').value;

      const gramosIngresados = unidad === 'kg' ? (rawCantidad * 1000) : rawCantidad;
      const stockAnterior = parseFloat(productoSeleccionado.stock_gramos) || 0;

      let stockFinal = 0;
      if (modo === 'set') {
        stockFinal = gramosIngresados;
      } else {
        stockFinal = stockAnterior + gramosIngresados;
      }

      stockFinal = redondear(stockFinal, 1);

      try {
        await dbPatch('productos', productoSeleccionado.id, { stock_gramos: stockFinal });

        productoSeleccionado.stock_gramos = stockFinal;
        actualizarMetricasFinancieras();
        renderTablaInventario(productos);

        alert(`✅ Stock de ${productoSeleccionado.nombre} actualizado a ${stockFinal}g.`);
        cancelarEdicion();
      } catch (e) {
        alert("Error al actualizar inventario: " + e.message);
      }
    }

    // --- ESCÁNER CON CÁMARA ---
    async function encenderEscanner() {
      document.getElementById('scanner-container').style.display = 'block';
      html5QrCode = new Html5Qrcode("reader");

      const config = { fps: 10, qrbox: { width: 250, height: 150 }, aspectRatio: 1.0 };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            procesarCodigo(decodedText);
          }
        );
      } catch (err) {
        console.error("Error al iniciar cámara:", err);
        alert("No se pudo iniciar la cámara.");
      }
    }

    async function apagarEscanner() {
      if (html5QrCode) {
        await html5QrCode.stop();
        html5QrCode = null;
      }
      document.getElementById('scanner-container').style.display = 'none';
    }

    async function procesarCodigo(codigoFull) {
      const limpio = codigoFull.replace(/\*/g, '').trim();
      const codProdNum = parseInt(limpio.substring(0, 6));

      if (navigator.vibrate) navigator.vibrate(100);
      await apagarEscanner();

      const p = productos.find(x => x.codigo === codProdNum);
      if (p) {
        cargarParaEditar(p.id);
      } else {
        alert("Producto no encontrado en inventario con código: " + codProdNum);
      }
    }

    init();
  </script>
</body>

</html>
