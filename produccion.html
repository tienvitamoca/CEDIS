<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producción y Mano de Obra — CEDIS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .kpi-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      text-align: center;
      border-top: 4px solid var(--primary);
    }

    .kpi-card .num {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
    }

    .kpi-card .lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 10000;
      padding: 1rem;
      overflow-y: auto;
    }

    .modal-dialog {
      background: white;
      border-radius: var(--radius);
      max-width: 460px;
      margin: 1.5rem auto;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .prod-sel-box {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .filtro-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
    }

    .filtro-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .lote-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .lote-item.pagado {
      opacity: 0.75;
      background: #f8fafc;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <a href="index.html">←</a>
    <h1>⚙️ Producción y Empaque</h1>
    <button onclick="abrirModalEmpleados()" style="background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.4rem 0.7rem; font-size:0.8rem; font-weight:700; cursor:pointer;">
      👥 Personal
    </button>
  </nav>

  <div class="container has-bottom-nav">

    <!-- RESUMEN DE PAGO PENDIENTE -->
    <div class="kpi-grid">
      <div class="kpi-card" style="border-top-color: #8b5cf6;">
        <div class="num" id="kpi-bolsas-pendientes" style="color:#8b5cf6">0</div>
        <div class="lbl">Bolsas por Liquidar</div>
      </div>
      <div class="kpi-card" style="border-top-color: #ef4444;">
        <div class="num" id="kpi-mano-obra-deuda" style="color:#ef4444">$0.00</div>
        <div class="lbl">Mano de Obra por Pagar</div>
      </div>
      <div class="kpi-card" style="border-top-color: #16a34a;">
        <div class="num" id="kpi-bolsas-hoy" style="color:#16a34a">0</div>
        <div class="lbl">Bolsas Hechas Hoy</div>
      </div>
    </div>

    <!-- FORMULARIO RÁPIDO DE REGISTRO DE EMPAQUE -->
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title">Registrar Turno / Lote Terminado</div>

      <!-- SELECCIÓN DE TRABAJADOR -->
      <div class="field">
        <label>Personal de Empaque</label>
        <select id="prod-empleado" onchange="actualizarTarifaEmpleado()">
          <option value="">-- Seleccionar Trabajador --</option>
        </select>
      </div>

      <!-- BÚSQUEDA DIRECTA DE PRODUCTO -->
      <div class="field" style="margin-bottom: 0.5rem;">
        <label>Producto Empacado</label>
        
        <div class="search-wrap" style="margin-bottom:0.4rem;">
          <span class="icon">🔍</span>
          <input type="text" id="busqueda-producto" placeholder="Escribe el nombre o código del producto..." oninput="filtrarListaProductos()" autocomplete="off">
        </div>

        <!-- Sugerencias desplegables -->
        <div id="lista-sugerencias-prod" style="display:none; max-height:190px; overflow-y:auto; border:1.5px solid var(--border); border-radius:8px; background:white; margin-bottom:0.5rem;"></div>

        <!-- Producto activo seleccionado -->
        <div id="prod-seleccionado-badge" class="prod-sel-box" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div id="sel-prod-nombre" style="font-weight:700; color:var(--primary); font-size:0.92rem;"></div>
              <div id="sel-prod-det" style="font-size:0.75rem; color:var(--text-muted);"></div>
            </div>
            <button onclick="deseleccionarProducto()" style="background:none; border:none; color:var(--text-muted); font-size:1.1rem; cursor:pointer;">✕</button>
          </div>
        </div>
      </div>

      <!-- CANTIDAD Y TARIFA -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem">
        <div class="field">
          <label>Bolsas Terminadas</label>
          <input type="number" id="prod-bolsas" min="1" placeholder="Ej: 120" oninput="calcularTotalLote()">
        </div>
        <div class="field">
          <label>Pago x Bolsa ($)</label>
          <input type="number" id="prod-tarifa" step="0.10" value="0.50" oninput="calcularTotalLote()">
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:0.75rem 1rem; border-radius:8px; margin:0.75rem 0;">
        <span style="font-weight:700;">Pago de este lote:</span>
        <span id="prod-total-lbl" style="font-size:1.25rem; font-weight:800; color:#16a34a;">$0.00</span>
      </div>

      <button id="btn-guardar-lote" class="btn btn-primary btn-block" style="background:#2563eb; padding:12px; font-weight:bold;" onclick="guardarLoteProduccion()">
        💾 Anotar Producción
      </button>
    </div>

    <!-- CONTROL Y FILTRADO DE LOTES -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; flex-wrap:wrap; gap:0.5rem;">
        <div class="card-title" style="margin:0">Bitácora de Lotes y Pagos</div>
        
        <!-- BOTÓN INTELIGENTE DE LIQUIDACIÓN -->
        <button id="btn-accion-liquidar" class="btn btn-primary" style="background:#16a34a; font-size:0.78rem; padding:0.4rem 0.8rem; font-weight:700;" onclick="ejecutarLiquidacionSeleccionada()">
          💵 Liquidar Todo
        </button>
      </div>

      <!-- FILTROS DE ESTADO (CHIPS) -->
      <div style="display:flex; gap:0.4rem; margin-bottom:0.75rem; flex-wrap:wrap;">
        <button class="filtro-chip active" id="chip-pendientes" onclick="cambiarFiltroEstado('PENDIENTE', this)">⏳ Solo Pendientes</button>
        <button class="filtro-chip" id="chip-pagados" onclick="cambiarFiltroEstado('PAGADO', this)">✅ Solo Liquidados</button>
        <button class="filtro-chip" id="chip-todos" onclick="cambiarFiltroEstado('TODOS', this)">📋 Ver Todos</button>
      </div>

      <!-- FILTRO POR TRABAJADOR Y PRODUCTO -->
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem; margin-bottom:0.75rem;">
        <select id="filtro-trabajador" style="padding:0.45rem; border-radius:8px; border:1px solid var(--border); font-size:0.8rem;" onchange="renderizarLotes()">
          <option value="TODOS">Todos los trabajadores</option>
        </select>
        <input type="text" id="filtro-producto" placeholder="Filtrar por producto..." style="padding:0.45rem; border-radius:8px; border:1px solid var(--border); font-size:0.8rem;" oninput="renderizarLotes()">
      </div>

      <!-- SELECCIONADOR MASIVO -->
      <div id="barra-seleccion-masiva" style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:0.4rem 0.6rem; border-radius:6px; margin-bottom:0.5rem; font-size:0.75rem;">
        <label style="cursor:pointer; display:flex; align-items:center; gap:0.4rem; font-weight:600;">
          <input type="checkbox" id="chk-marcar-todos" onchange="toggleSeleccionarTodos(this.checked)">
          Marcar todos los visibles
        </label>
        <span id="txt-conteo-seleccionados" style="color:var(--text-muted); font-weight:700;">0 seleccionados</span>
      </div>

      <!-- LISTA DE LOTES -->
      <div id="lista-lotes-contenedor">
        <div class="spinner"></div>
      </div>
    </div>

  </div>

  <!-- MODAL GESTOR Y EDICIÓN DE EMPLEADOS -->
  <div id="modal-empleados" class="modal-backdrop">
    <div class="modal-dialog">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem">
        <h3 id="emp-form-titulo" style="margin:0; font-size:1.1rem">Personal de Empaque</h3>
        <button onclick="cerrarModalEmpleados()" style="background:none; border:none; font-size:1.3rem; cursor:pointer">✕</button>
      </div>

      <!-- Mini-Formulario Alta / Edición -->
      <div style="background:var(--bg); padding:0.75rem; border-radius:8px; margin-bottom:1rem;">
        <input type="hidden" id="emp-id">
        <div class="field" style="margin-bottom:0.4rem">
          <label style="font-size:0.7rem; font-weight:700;">Nombre del Trabajador *</label>
          <input type="text" id="emp-nombre" placeholder="Ej: Juan Pérez">
        </div>
        <div class="field" style="margin-bottom:0.4rem">
          <label style="font-size:0.7rem; font-weight:700;">Tarifa por defecto por bolsa ($):</label>
          <input type="number" id="emp-tarifa" step="0.10" value="0.50">
        </div>
        <div style="display:flex; gap:0.4rem; margin-top:0.6rem;">
          <button id="btn-guardar-emp" class="btn btn-primary" style="flex:2; padding:0.5rem; font-size:0.85rem;" onclick="guardarEmpleado()">
            Guardar Trabajador
          </button>
          <button id="btn-cancelar-emp" class="btn btn-outline" style="flex:1; padding:0.5rem; font-size:0.85rem; display:none;" onclick="limpiarFormEmpleado()">
            Cancelar
          </button>
        </div>
      </div>

      <div class="card-title" style="font-size:0.82rem; margin-bottom:0.4rem;">Trabajadores Registrados</div>
      <div id="lista-empleados-contenedor" style="max-height:220px; overflow-y:auto;">
        <div class="spinner"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon">🏠</span> Inicio</a>
    <a href="inventario.html"><span class="icon">📦</span> Stock</a>
    <a href="compras.html"><span class="icon">📥</span> Compras</a>
    <a href="produccion.html" class="active"><span class="icon">⚙️</span> Producción</a>
    <a href="gastos.html"><span class="icon">📉</span> Gastos</a>
  </nav>

  <script src="supabase.js"></script>
  <script>
    let empleados = [];
    let productos = [];
    let todosLosLotes = [];
    let lotesFiltradosVisibles = [];
    let lotesSeleccionadosIds = new Set();
    let productoSeleccionadoId = null;
    let filtroEstadoActual = 'PENDIENTE';

    async function init() {
      await Promise.all([cargarProductos(), cargarEmpleados()]);
      await cargarLotes();
    }

    // ─── 1. BÚSQUEDA DIRECTA DE PRODUCTOS ────────────────────────
    async function cargarProductos() {
      try {
        productos = await dbGet('productos', 'select=id,nombre,codigo&order=nombre.asc') || [];
      } catch (e) {
        console.error("Error al cargar productos:", e);
      }
    }

    function filtrarListaProductos() {
      const q = (document.getElementById('busqueda-producto').value || '').trim().toLowerCase();
      const cont = document.getElementById('lista-sugerencias-prod');

      if (!q) {
        cont.style.display = 'none';
        return;
      }

      const filtrados = productos.filter(p => 
        p.nombre.toLowerCase().includes(q) || String(p.codigo).includes(q)
      );

      if (!filtrados.length) {
        cont.innerHTML = '<div style="padding:0.7rem; color:var(--text-muted); font-size:0.8rem; text-align:center;">Sin resultados</div>';
        cont.style.display = 'block';
        return;
      }

      cont.innerHTML = filtrados.slice(0, 15).map(p => `
        <div onclick='seleccionarProducto(${JSON.stringify(p)})' 
             style="padding:0.6rem 0.8rem; border-bottom:1px solid var(--border); cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:700; font-size:0.85rem;">${p.nombre}</div>
            <div style="font-size:0.7rem; color:var(--text-muted);">Código: ${p.codigo}</div>
          </div>
          <span style="color:var(--primary); font-size:1.1rem; font-weight:bold;">＋</span>
        </div>
      `).join('');

      cont.style.display = 'block';
    }

    function seleccionarProducto(p) {
      productoSeleccionadoId = p.id;
      document.getElementById('sel-prod-nombre').textContent = p.nombre;
      document.getElementById('sel-prod-det').textContent = `Código: ${p.codigo}`;

      document.getElementById('prod-seleccionado-badge').style.display = 'block';
      document.getElementById('lista-sugerencias-prod').style.display = 'none';
      document.getElementById('busqueda-producto').value = '';
    }

    function deseleccionarProducto() {
      productoSeleccionadoId = null;
      document.getElementById('prod-seleccionado-badge').style.display = 'none';
      document.getElementById('busqueda-producto').value = '';
      document.getElementById('lista-sugerencias-prod').style.display = 'none';
    }

    // ─── 2. EMPLEADOS Y TARIFAS ───────────────────────────────────
    async function cargarEmpleados() {
      try {
        empleados = await dbGet('empleados', 'order=nombre.asc') || [];
        
        // Select de registro
        const sel = document.getElementById('prod-empleado');
        sel.innerHTML = '<option value="">-- Seleccionar Trabajador --</option>';
        
        // Select de filtrado
        const selFiltro = document.getElementById('filtro-trabajador');
        selFiltro.innerHTML = '<option value="TODOS">Todos los trabajadores</option>';

        empleados.forEach(e => {
          sel.innerHTML += `<option value="${e.id}" data-tarifa="${e.pago_por_bolsa}">${e.nombre}</option>`;
          selFiltro.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
        });
        renderizarListaEmpleados();
      } catch (e) { console.warn(e); }
    }

    function actualizarTarifaEmpleado() {
      const sel = document.getElementById('prod-empleado');
      const tarifa = sel.options[sel.selectedIndex]?.getAttribute('data-tarifa') || 0.50;
      document.getElementById('prod-tarifa').value = tarifa;
      calcularTotalLote();
    }

    function calcularTotalLote() {
      const bolsas = parseInt(document.getElementById('prod-bolsas').value) || 0;
      const tarifa = parseFloat(document.getElementById('prod-tarifa').value) || 0;
      const total = redondear(bolsas * tarifa, 2);
      document.getElementById('prod-total-lbl').textContent = formatPeso(total);
    }

    // ─── 3. GUARDAR LOTE DE EMPAQUE ──────────────────────────────
    async function guardarLoteProduccion() {
      const empId = document.getElementById('prod-empleado').value;
      const bolsas = parseInt(document.getElementById('prod-bolsas').value) || 0;
      const tarifa = parseFloat(document.getElementById('prod-tarifa').value) || 0;
      const total = redondear(bolsas * tarifa, 2);

      if (!empId) return alert("Selecciona el trabajador.");
      if (!productoSeleccionadoId) return alert("Busca y selecciona el producto empacado.");
      if (bolsas <= 0) return alert("Ingresa una cantidad de bolsas válida.");

      const btn = document.getElementById('btn-guardar-lote');
      btn.disabled = true;

      try {
        await dbPost('produccion_lotes', {
          empleado_id: parseInt(empId),
          producto_id: parseInt(productoSeleccionadoId),
          bolsas_producidas: bolsas,
          pago_unitario: tarifa,
          total_mano_obra: total,
          estado_pago: 'PENDIENTE'
        });

        alert(`✅ Registradas ${bolsas} bolsas empacadas.`);
        document.getElementById('prod-bolsas').value = '';
        document.getElementById('prod-total-lbl').textContent = '$0.00';
        deseleccionarProducto();
        await cargarLotes();

      } catch (e) {
        alert("Error al guardar lote: " + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    // ─── 4. CARGAR Y FILTRAR LOTES ───────────────────────────────
    async function cargarLotes() {
      try {
        todosLosLotes = await dbGet('produccion_lotes', 'select=*,empleados(nombre),productos(nombre)&order=id.desc') || [];
        lotesSeleccionadosIds.clear();
        actualizarKpisGenerales();
        renderizarLotes();
      } catch (e) {
        document.getElementById('lista-lotes-contenedor').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      }
    }

    function cambiarFiltroEstado(estado, btn) {
      document.querySelectorAll('.filtro-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      filtroEstadoActual = estado;
      lotesSeleccionadosIds.clear();
      renderizarLotes();
    }

    function actualizarKpisGenerales() {
      const pendientes = todosLosLotes.filter(l => l.estado_pago === 'PENDIENTE');
      const hoyStr = new Date().toDateString();
      const lotesHoy = todosLosLotes.filter(l => new Date(l.fecha).toDateString() === hoyStr);

      let bolsasPend = 0;
      let deudaTotal = 0;
      pendientes.forEach(l => {
        bolsasPend += parseInt(l.bolsas_producidas) || 0;
        deudaTotal += parseFloat(l.total_mano_obra) || 0;
      });

      let bolsasHoyTotal = 0;
      lotesHoy.forEach(l => {
        bolsasHoyTotal += parseInt(l.bolsas_producidas) || 0;
      });

      document.getElementById('kpi-bolsas-pendientes').textContent = bolsasPend.toLocaleString('es-MX');
      document.getElementById('kpi-mano-obra-deuda').textContent = formatPeso(deudaTotal);
      document.getElementById('kpi-bolsas-hoy').textContent = bolsasHoyTotal.toLocaleString('es-MX');
    }

    function renderizarLotes() {
      const cont = document.getElementById('lista-lotes-contenedor');
      const empFiltro = document.getElementById('filtro-trabajador').value;
      const prodFiltro = (document.getElementById('filtro-producto').value || '').trim().toLowerCase();

      // Filtrar según estado, trabajador y texto de producto
      lotesFiltradosVisibles = todosLosLotes.filter(l => {
        const matchEstado = (filtroEstadoActual === 'TODOS') || (l.estado_pago === filtroEstadoActual);
        const matchEmp = (empFiltro === 'TODOS') || (String(l.empleado_id) === String(empFiltro));
        const matchProd = !prodFiltro || (l.productos?.nombre && l.productos.nombre.toLowerCase().includes(prodFiltro));
        return matchEstado && matchEmp && matchProd;
      });

      actualizarBotonLiquidacion();

      if (!lotesFiltradosVisibles.length) {
        cont.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:1.5rem">No hay lotes con los filtros seleccionados.</p>';
        return;
      }

      cont.innerHTML = lotesFiltradosVisibles.map(l => {
        const esPagado = l.estado_pago === 'PAGADO';
        const isChecked = lotesSeleccionadosIds.has(l.id);

        return `
          <div class="lote-item ${esPagado ? 'pagado' : ''}">
            <div style="display:flex; align-items:center; gap:0.6rem;">
              ${!esPagado ? `
                <input type="checkbox" onchange="toggleSeleccionLote(${l.id}, this.checked)" ${isChecked ? 'checked' : ''} style="cursor:pointer; width:16px; height:16px;">
              ` : `
                <span title="Liquidado" style="font-size:0.85rem;">✅</span>
              `}
              <div>
                <strong>${l.empleados?.nombre || 'Operador'}</strong> — ${l.productos?.nombre || 'Producto'}
                <div style="font-size:0.72rem; color:var(--text-muted)">
                  ${new Date(l.fecha).toLocaleDateString('es-MX')} · ${l.bolsas_producidas} bolsas x $${parseFloat(l.pago_unitario).toFixed(2)}
                  ${esPagado ? '<span class="badge badge-green" style="font-size:0.62rem; margin-left:4px;">LIQUIDADO</span>' : '<span class="badge badge-blue" style="font-size:0.62rem; margin-left:4px;">PENDIENTE</span>'}
                </div>
              </div>
            </div>

            <div style="text-align:right; display:flex; align-items:center; gap:0.4rem;">
              <strong style="color:${esPagado ? '#16a34a' : '#ef4444'}; margin-right:4px;">${formatPeso(l.total_mano_obra)}</strong>

              ${!esPagado ? `
                <button onclick="liquidarLoteIndividual(${l.id})" class="btn btn-primary" style="background:#16a34a; font-size:0.68rem; padding:0.25rem 0.5rem; border-radius:4px;" title="Pagar este lote">
                  💵 Pagar
                </button>
                <button onclick="cancelarLotePendiente(${l.id})" style="background:#fee2e2; color:#b91c1c; border:none; border-radius:4px; padding:0.25rem 0.45rem; font-size:0.7rem; cursor:pointer;" title="Eliminar / Descartar lote">
                  ✕
                </button>
              ` : `
                <button onclick="revertirLoteAPendiente(${l.id})" style="background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:0.25rem 0.45rem; font-size:0.68rem; cursor:pointer;" title="Revertir a Pendiente">
                  ↩️
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    // ─── 5. GESTIÓN DE SELECCIÓN Y LIQUIDACIÓN FLEXIBLE ──────────
    function toggleSeleccionLote(id, checked) {
      if (checked) {
        lotesSeleccionadosIds.add(id);
      } else {
        lotesSeleccionadosIds.delete(id);
      }
      actualizarBotonLiquidacion();
    }

    function toggleSeleccionarTodos(checked) {
      lotesSeleccionadosIds.clear();
      if (checked) {
        lotesFiltradosVisibles.filter(l => l.estado_pago === 'PENDIENTE').forEach(l => {
          lotesSeleccionadosIds.add(l.id);
        });
      }
      renderizarLotes();
    }

    function actualizarBotonLiquidacion() {
      const btn = document.getElementById('btn-accion-liquidar');
      const empFiltro = document.getElementById('filtro-trabajador').value;
      const pendientesVisibles = lotesFiltradosVisibles.filter(l => l.estado_pago === 'PENDIENTE');

      document.getElementById('txt-conteo-seleccionados').textContent = `${lotesSeleccionadosIds.size} seleccionados`;

      if (lotesSeleccionadosIds.size > 0) {
        let totalSeleccionado = 0;
        todosLosLotes.forEach(l => {
          if (lotesSeleccionadosIds.has(l.id)) totalSeleccionado += parseFloat(l.total_mano_obra) || 0;
        });
        btn.style.display = 'block';
        btn.textContent = `💵 Liquidar Seleccionados (${formatPeso(totalSeleccionado)})`;
        return;
      }

      if (pendientesVisibles.length > 0) {
        let total = 0;
        pendientesVisibles.forEach(l => total += parseFloat(l.total_mano_obra) || 0);

        btn.style.display = 'block';
        if (empFiltro !== 'TODOS') {
          const empNombre = empleados.find(e => String(e.id) === String(empFiltro))?.nombre || 'Trabajador';
          btn.textContent = `💵 Liquidar a ${empNombre} (${formatPeso(total)})`;
        } else {
          btn.textContent = `💵 Liquidar Visibles (${formatPeso(total)})`;
        }
      } else {
        btn.style.display = 'none';
      }
    }

    async function ejecutarLiquidacionSeleccionada() {
      let lotesAPagar = [];

      if (lotesSeleccionadosIds.size > 0) {
        lotesAPagar = todosLosLotes.filter(l => lotesSeleccionadosIds.has(l.id) && l.estado_pago === 'PENDIENTE');
      } else {
        lotesAPagar = lotesFiltradosVisibles.filter(l => l.estado_pago === 'PENDIENTE');
      }

      if (!lotesAPagar.length) return alert("No hay lotes pendientes seleccionados para liquidar.");

      let totalPagar = 0;
      let totalBolsas = 0;
      lotesAPagar.forEach(l => {
        totalPagar += parseFloat(l.total_mano_obra) || 0;
        totalBolsas += parseInt(l.bolsas_producidas) || 0;
      });

      const empFiltro = document.getElementById('filtro-trabajador').value;
      let conceptoGasto = `Pago destajo empaque (${totalBolsas} bolsas)`;
      if (empFiltro !== 'TODOS') {
        const empNombre = empleados.find(e => String(e.id) === String(empFiltro))?.nombre || '';
        if (empNombre) conceptoGasto = `Pago destajo (${empNombre} - ${totalBolsas} bolsas)`;
      }

      if (!confirm(`¿Confirmas liquidar ${formatPeso(totalPagar)} por ${totalBolsas} bolsas empacadas en ${lotesAPagar.length} lote(s)? Esto se enviará al reporte de Gastos.`)) return;

      try {
        // 1. Guardar en compras_gastos
        await dbPost('compras_gastos', {
          tipo: 'OPERATIVO',
          categoria: 'Mano de Obra',
          concepto: conceptoGasto,
          total: totalPagar,
          estado: 'COMPLETADO'
        });

        // 2. Marcar lotes como PAGADO
        for (const l of lotesAPagar) {
          await dbPatch('produccion_lotes', l.id, { estado_pago: 'PAGADO' });
        }

        alert("✅ Mano de obra liquidada y registrada exitosamente en Gastos.");
        lotesSeleccionadosIds.clear();
        await cargarLotes();

      } catch (e) {
        alert("Error al liquidar: " + e.message);
      }
    }

    async function liquidarLoteIndividual(loteId) {
      const lote = todosLosLotes.find(l => l.id === loteId);
      if (!lote) return;

      const total = parseFloat(lote.total_mano_obra) || 0;
      const bolsas = lote.bolsas_producidas;
      const trabajador = lote.empleados?.nombre || 'Trabajador';

      if (!confirm(`¿Liquidar ${formatPeso(total)} a ${trabajador} por ${bolsas} bolsas de ${lote.productos?.nombre}?`)) return;

      try {
        await dbPost('compras_gastos', {
          tipo: 'OPERATIVO',
          categoria: 'Mano de Obra',
          concepto: `Pago destajo ${trabajador} (${bolsas} bolsas)`,
          total: total,
          estado: 'COMPLETADO'
        });

        await dbPatch('produccion_lotes', loteId, { estado_pago: 'PAGADO' });
        mostrarToast("✅ Lote liquidado y enviado a Gastos");
        await cargarLotes();
      } catch (e) {
        alert("Error al liquidar lote: " + e.message);
      }
    }

    async function revertirLoteAPendiente(loteId) {
      if (!confirm("¿Revertir este lote liquidado a estado PENDIENTE? (Nota: Si deseas anular el egreso contable, hazlo desde gastos.html)")) return;

      try {
        await dbPatch('produccion_lotes', loteId, { estado_pago: 'PENDIENTE' });
        await cargarLotes();
      } catch (e) {
        alert("Error al revertir: " + e.message);
      }
    }

    async function cancelarLotePendiente(loteId) {
      if (!confirm("¿Cancelar y eliminar permanentemente este lote de producción?")) return;

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/produccion_lotes?id=eq.${loteId}`, {
          method: 'DELETE', headers: { ...headers }
        });
        await cargarLotes();
      } catch (e) {
        alert("Error al cancelar lote: " + e.message);
      }
    }

    // ─── 6. GESTIÓN Y EDICIÓN DE EMPLEADOS ────────────────────────
    function abrirModalEmpleados() {
      document.getElementById('modal-empleados').style.display = 'block';
      limpiarFormEmpleado();
      renderizarListaEmpleados();
    }

    function cerrarModalEmpleados() {
      document.getElementById('modal-empleados').style.display = 'none';
    }

    function renderizarListaEmpleados() {
      const cont = document.getElementById('lista-empleados-contenedor');
      if (!empleados.length) {
        cont.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.8rem">Sin personal registrado.</p>';
        return;
      }
      cont.innerHTML = empleados.map(e => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.45rem 0; border-bottom:1px solid var(--border); font-size:0.82rem;">
          <div>
            <strong>${e.nombre}</strong>
            <div style="font-size:0.7rem; color:var(--text-muted);">$${parseFloat(e.pago_por_bolsa).toFixed(2)} por bolsa</div>
          </div>
          <div style="display:flex; gap:0.25rem;">
            <button onclick='editarEmpleado(${JSON.stringify(e)})' style="background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:0.25rem 0.5rem; cursor:pointer; font-size:0.75rem;">✏️</button>
            <button onclick="eliminarEmpleado(${e.id})" style="background:#fee2e2; color:#b91c1c; border:none; border-radius:4px; padding:0.25rem 0.5rem; cursor:pointer; font-size:0.75rem;">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function editarEmpleado(e) {
      document.getElementById('emp-id').value = e.id;
      document.getElementById('emp-nombre').value = e.nombre;
      document.getElementById('emp-tarifa').value = e.pago_por_bolsa;

      document.getElementById('emp-form-titulo').textContent = "Editar Trabajador";
      document.getElementById('btn-guardar-emp').textContent = "Actualizar Trabajador";
      document.getElementById('btn-cancelar-emp').style.display = 'block';
    }

    function limpiarFormEmpleado() {
      document.getElementById('emp-id').value = '';
      document.getElementById('emp-nombre').value = '';
      document.getElementById('emp-tarifa').value = '0.50';

      document.getElementById('emp-form-titulo').textContent = "Personal de Empaque";
      document.getElementById('btn-guardar-emp').textContent = "Guardar Trabajador";
      document.getElementById('btn-cancelar-emp').style.display = 'none';
    }

    async function guardarEmpleado() {
      const id = document.getElementById('emp-id').value;
      const nombre = document.getElementById('emp-nombre').value.trim();
      const tarifa = parseFloat(document.getElementById('emp-tarifa').value) || 0.50;

      if (!nombre) return alert("Ingresa el nombre del trabajador.");

      try {
        if (id) {
          await dbPatch('empleados', id, { nombre, pago_por_bolsa: tarifa });
        } else {
          await dbPost('empleados', { nombre, pago_por_bolsa: tarifa, activo: true });
        }

        limpiarFormEmpleado();
        await cargarEmpleados();
        renderizarListaEmpleados();
      } catch (e) {
        alert("Error al guardar: " + e.message);
      }
    }

    async function eliminarEmpleado(id) {
      if (!confirm("¿Eliminar este trabajador del catálogo?")) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/empleados?id=eq.${id}`, {
          method: 'DELETE', headers: { ...headers }
        });
        await cargarEmpleados();
        renderizarListaEmpleados();
      } catch (e) {
        alert("Error al eliminar trabajador: " + e.message);
      }
    }

    init();
  </script>
</body>

</html>
