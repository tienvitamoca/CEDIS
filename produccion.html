<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Producción y Mano de Obra — CEDIS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .kpi-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1rem;
      text-align: center;
      border-top: 4px solid var(--primary);
    }

    .kpi-card .num {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
    }

    .kpi-card .lbl {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .tile-card {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 0.6rem;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90px;
      transition: all 0.15s ease;
      box-shadow: var(--shadow);
    }

    .tile-card:active {
      transform: scale(0.96);
      background: var(--bg);
    }

    .tile-card .icon {
      font-size: 1.8rem;
      margin-bottom: 0.35rem;
    }

    .tile-card .title {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.15;
    }

    .tile-card .subtitle {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .cat-breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 10000;
      padding: 1rem;
      overflow-y: auto;
    }

    .modal-dialog {
      background: white;
      border-radius: var(--radius);
      max-width: 480px;
      margin: 1.5rem auto;
      padding: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <a href="index.html">←</a>
    <h1>⚙️ Producción y Empaque</h1>
    <button onclick="abrirModalEmpleados()" style="background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.4rem 0.7rem; font-size:0.8rem; font-weight:700; cursor:pointer;">
      👥 Personal
    </button>
  </nav>

  <div class="container has-bottom-nav">

    <!-- RESUMEN DE PAGO PENDIENTE -->
    <div class="kpi-grid">
      <div class="kpi-card" style="border-top-color: #8b5cf6;">
        <div class="num" id="kpi-bolsas-pendientes" style="color:#8b5cf6">0</div>
        <div class="lbl">Bolsas por Liquidar</div>
      </div>
      <div class="kpi-card" style="border-top-color: #ef4444;">
        <div class="num" id="kpi-mano-obra-deuda" style="color:#ef4444">$0.00</div>
        <div class="lbl">Mano de Obra Pendiente</div>
      </div>
      <div class="kpi-card" style="border-top-color: #16a34a;">
        <div class="num" id="kpi-bolsas-hoy" style="color:#16a34a">0</div>
        <div class="lbl">Bolsas Hechas Hoy</div>
      </div>
    </div>

    <!-- NAVEGACIÓN Y SELECCIÓN DE PRODUCTO TIPO TIENDATEK -->
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title">1. Seleccionar Producto Empacado</div>
      
      <div class="search-wrap" style="margin-bottom:0.5rem">
        <span class="icon">🔍</span>
        <input type="text" id="busqueda-prod" placeholder="Buscar por nombre o código..." oninput="filtrarProductosDirectos()" autocomplete="off">
      </div>

      <div id="breadcrumb-wrap" style="display:none;" class="cat-breadcrumb">
        <button onclick="volverACategorias()" class="btn btn-outline" style="padding:0.25rem 0.6rem; font-size:0.75rem;">← Categorías</button>
        <span id="categoria-nombre-activa"></span>
      </div>

      <div id="grid-contenedor" class="catalog-grid">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- LISTA DE LOTES PENDIENTES DE PAGO -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem">
        <div class="card-title" style="margin:0">Lotes Pendientes de Pago</div>
        <button id="btn-liquidar-todo" class="btn btn-primary" style="background:#16a34a; font-size:0.78rem; padding:0.35rem 0.7rem;" onclick="liquidarManoDeObra()">
          💵 Liquidar Todo
        </button>
      </div>

      <div id="lista-lotes-pendientes">
        <div class="spinner"></div>
      </div>
    </div>

  </div>

  <!-- MODAL: REGISTRAR BOLSAS DEL PRODUCTO SELECCIONADO -->
  <div id="modal-anotar-lote" class="modal-backdrop">
    <div class="modal-dialog">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.75rem">
        <div>
          <h3 id="modal-prod-nombre" style="margin:0; color:var(--primary); font-size:1.15rem"></h3>
          <small id="modal-prod-stock" style="color:var(--text-muted); font-weight:600;"></small>
        </div>
        <button onclick="cerrarModalAnotarLote()" style="background:none; border:none; font-size:1.3rem; cursor:pointer">✕</button>
      </div>

      <div class="field">
        <label>Personal de Empaque</label>
        <select id="prod-empleado" onchange="actualizarTarifaEmpleado()">
          <option value="">-- Seleccionar Trabajador --</option>
        </select>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:0.5rem">
        <div class="field">
          <label>Bolsas Empacadas</label>
          <input type="number" id="prod-bolsas" min="1" placeholder="Ej: 150" oninput="calcularTotalLote()">
        </div>
        <div class="field">
          <label>Pago x Bolsa ($)</label>
          <input type="number" id="prod-tarifa" step="0.05" value="0.50" oninput="calcularTotalLote()">
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:0.75rem 1rem; border-radius:8px; margin:0.75rem 0;">
        <span style="font-weight:700;">Pago de este lote:</span>
        <span id="prod-total-lbl" style="font-size:1.3rem; font-weight:800; color:#16a34a;">$0.00</span>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px; margin-top:1rem;">
        <button id="btn-guardar-lote" class="btn btn-primary btn-block" style="background:#2563eb; font-weight:bold; padding:12px;" onclick="guardarLoteProduccion()">
          💾 Guardar Lote de Producción
        </button>
        <button class="btn btn-outline btn-block" onclick="cerrarModalAnotarLote()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- MODAL GESTOR DE EMPLEADOS (ALTA Y EDICIÓN) -->
  <div id="modal-empleados" class="modal-backdrop">
    <div class="modal-dialog">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem">
        <h3 style="margin:0; font-size:1.1rem" id="emp-form-titulo">Personal de Empaque</h3>
        <button onclick="cerrarModalEmpleados()" style="background:none; border:none; font-size:1.3rem; cursor:pointer">✕</button>
      </div>

      <div style="background:var(--bg); padding:0.75rem; border-radius:8px; margin-bottom:1rem;">
        <input type="hidden" id="emp-id">
        <div class="field" style="margin-bottom:0.4rem">
          <label style="font-size:0.72rem; font-weight:bold">Nombre del Trabajador *</label>
          <input type="text" id="emp-nombre" placeholder="Ej: Juan Pérez">
        </div>
        <div class="field" style="margin-bottom:0.4rem">
          <label style="font-size:0.72rem; font-weight:bold">Tarifa habitual por bolsa ($):</label>
          <input type="number" id="emp-tarifa" step="0.05" value="0.50">
        </div>
        <div style="display:flex; gap:0.4rem; margin-top:0.6rem;">
          <button id="btn-guardar-emp" class="btn btn-primary" style="flex:2; padding:0.5rem; font-size:0.85rem;" onclick="guardarEmpleado()">
            Guardar Trabajador
          </button>
          <button id="btn-cancelar-emp" class="btn btn-outline" style="flex:1; padding:0.5rem; font-size:0.85rem; display:none;" onclick="limpiarFormEmpleado()">
            Cancelar
          </button>
        </div>
      </div>

      <div class="card-title" style="font-size:0.8rem; margin-bottom:0.4rem">Trabajadores Registrados</div>
      <div id="lista-empleados-contenedor" style="max-height:220px; overflow-y:auto;"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><span class="icon">🏠</span> Inicio</a>
    <a href="inventario.html"><span class="icon">📦</span> Stock</a>
    <a href="compras.html"><span class="icon">📥</span> Compras</a>
    <a href="produccion.html" class="active"><span class="icon">⚙️</span> Producción</a>
    <a href="gastos.html"><span class="icon">📉</span> Gastos</a>
  </nav>

  <script src="supabase.js"></script>
  <script>
    let categorias = [];
    let productos = [];
    let empleados = [];
    let lotesPendientes = [];
    let lotesHoy = [];
    let categoriaSeleccionada = null;
    let productoSeleccionado = null;

    async function init() {
      await Promise.all([cargarCategorias(), cargarProductos(), cargarEmpleados()]);
      renderizarCategorias();
      await cargarLotes();
    }

    async function cargarCategorias() {
      try {
        categorias = await dbGet('tipos_producto', 'order=nombre.asc') || [];
      } catch (e) { console.error(e); }
    }

    async function cargarProductos() {
      try {
        productos = await dbGet('productos', 'select=*,tipos_producto(nombre)&order=nombre.asc') || [];
      } catch (e) { console.error(e); }
    }

    async function cargarEmpleados() {
      try {
        empleados = await dbGet('empleados', 'order=nombre.asc') || [];
        poblarSelectEmpleados();
        renderizarListaEmpleados();
      } catch (e) { console.warn(e); }
    }

    function poblarSelectEmpleados() {
      const sel = document.getElementById('prod-empleado');
      sel.innerHTML = '<option value="">-- Seleccionar Trabajador --</option>';
      empleados.forEach(e => {
        sel.innerHTML += `<option value="${e.id}" data-tarifa="${e.pago_por_bolsa}">${e.nombre}</option>`;
      });
    }

    async function cargarLotes() {
      try {
        const todos = await dbGet('produccion_lotes', 'select=*,empleados(nombre),productos(nombre)&order=id.desc') || [];
        lotesPendientes = todos.filter(l => l.estado_pago === 'PENDIENTE');

        const hoyStr = new Date().toDateString();
        lotesHoy = todos.filter(l => new Date(l.fecha).toDateString() === hoyStr);

        actualizarResumen();
        renderizarLotesPendientes();
      } catch (e) {
        document.getElementById('lista-lotes-pendientes').innerHTML = `<div class="alert alert-error">${e.message}</div>`;
      }
    }

    // ─── TIENDATEK: CATEGORÍAS Y PRODUCTOS ────────────────────────
    function renderizarCategorias() {
      categoriaSeleccionada = null;
      document.getElementById('breadcrumb-wrap').style.display = 'none';
      document.getElementById('busqueda-prod').value = '';
      const cont = document.getElementById('grid-contenedor');

      if (!categorias.length) {
        cont.innerHTML = '<p style="color:var(--text-muted)">Sin categorías configuradas.</p>';
        return;
      }

      cont.innerHTML = categorias.map(c => {
        const totalProds = productos.filter(p => p.tipo_id === c.id).length;
        return `
          <div class="tile-card" onclick="seleccionarCategoria(${c.id}, '${c.nombre}')">
            <div class="icon">🏷️</div>
            <div class="title">${c.nombre}</div>
            <div class="subtitle">${totalProds} productos</div>
          </div>
        `;
      }).join('');
    }

    function seleccionarCategoria(catId, catNombre) {
      categoriaSeleccionada = catId;
      document.getElementById('breadcrumb-wrap').style.display = 'flex';
      document.getElementById('categoria-nombre-activa').textContent = catNombre;

      const filtrados = productos.filter(p => p.tipo_id === catId);
      renderizarGridProductos(filtrados);
    }

    function volverACategorias() {
      renderizarCategorias();
    }

    function renderizarGridProductos(lista) {
      const cont = document.getElementById('grid-contenedor');
      if (!lista.length) {
        cont.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:1rem;">No hay productos en esta sección.</p>';
        return;
      }

      cont.innerHTML = lista.map(p => {
        const stockG = parseFloat(p.stock_gramos) || 0;
        const textoStock = stockG >= 1000 ? `${(stockG / 1000).toFixed(1)} kg` : `${stockG} g`;

        return `
          <div class="tile-card" onclick='abrirModalAnotarLote(${JSON.stringify(p)})'>
            <div class="icon">📦</div>
            <div class="title">${p.nombre}</div>
            <div class="subtitle" style="font-weight:700; color:var(--primary);">${textoStock}</div>
          </div>
        `;
      }).join('');
    }

    function filtrarProductosDirectos() {
      const q = document.getElementById('busqueda-prod').value.trim().toLowerCase();
      if (!q) {
        if (categoriaSeleccionada) {
          renderizarGridProductos(productos.filter(p => p.tipo_id === categoriaSeleccionada));
        } else {
          renderizarCategorias();
        }
        return;
      }

      document.getElementById('breadcrumb-wrap').style.display = 'none';
      const encontrados = productos.filter(p =>
        p.nombre.toLowerCase().includes(q) || String(p.codigo).includes(q)
      );
      renderizarGridProductos(encontrados);
    }

    // ─── MODAL: ANOTAR LOTE ───────────────────────────────────────
    function abrirModalAnotarLote(prod) {
      productoSeleccionado = prod;
      document.getElementById('modal-prod-nombre').textContent = prod.nombre;
      const stockG = parseFloat(prod.stock_gramos) || 0;
      const textoStock = stockG >= 1000 ? `${(stockG / 1000).toFixed(2)} kg` : `${stockG} g`;
      document.getElementById('modal-prod-stock').textContent = `Stock en bodega: ${textoStock}`;

      document.getElementById('prod-bolsas').value = '';
      document.getElementById('prod-total-lbl').textContent = '$0.00';

      const selEmp = document.getElementById('prod-empleado');
      if (selEmp.selectedIndex > 0) {
        actualizarTarifaEmpleado();
      }

      document.getElementById('modal-anotar-lote').style.display = 'block';
    }

    function cerrarModalAnotarLote() {
      document.getElementById('modal-anotar-lote').style.display = 'none';
      productoSeleccionado = null;
    }

    function actualizarTarifaEmpleado() {
      const sel = document.getElementById('prod-empleado');
      const tarifa = sel.options[sel.selectedIndex]?.getAttribute('data-tarifa') || 0.50;
      document.getElementById('prod-tarifa').value = tarifa;
      calcularTotalLote();
    }

    function calcularTotalLote() {
      const bolsas = parseInt(document.getElementById('prod-bolsas').value) || 0;
      const tarifa = parseFloat(document.getElementById('prod-tarifa').value) || 0;
      const total = redondear(bolsas * tarifa, 2);
      document.getElementById('prod-total-lbl').textContent = formatPeso(total);
    }

    async function guardarLoteProduccion() {
      if (!productoSeleccionado) return;

      const empId = document.getElementById('prod-empleado').value;
      const bolsas = parseInt(document.getElementById('prod-bolsas').value) || 0;
      const tarifa = parseFloat(document.getElementById('prod-tarifa').value) || 0;
      const total = redondear(bolsas * tarifa, 2);

      if (!empId) return alert("Por favor selecciona quién realizó el empacado.");
      if (bolsas <= 0) return alert("Ingresa una cantidad de bolsas válida.");

      const btn = document.getElementById('btn-guardar-lote');
      btn.disabled = true;

      try {
        await dbPost('produccion_lotes', {
          empleado_id: parseInt(empId),
          producto_id: productoSeleccionado.id,
          bolsas_producidas: bolsas,
          pago_unitario: tarifa,
          total_mano_obra: total,
          estado_pago: 'PENDIENTE'
        });

        alert(`✅ Registradas ${bolsas} bolsas empacadas de ${productoSeleccionado.nombre}`);
        cerrarModalAnotarLote();
        await cargarLotes();

      } catch (e) {
        alert("Error al guardar producción: " + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    // ─── RESUMEN Y LOTES PENDIENTES ──────────────────────────────
    function actualizarResumen() {
      let bolsasPend = 0;
      let deudaTotal = 0;

      lotesPendientes.forEach(l => {
        bolsasPend += parseInt(l.bolsas_producidas) || 0;
        deudaTotal += parseFloat(l.total_mano_obra) || 0;
      });

      let bolsasHoyTotal = 0;
      lotesHoy.forEach(l => {
        bolsasHoyTotal += parseInt(l.bolsas_producidas) || 0;
      });

      document.getElementById('kpi-bolsas-pendientes').textContent = bolsasPend.toLocaleString('es-MX');
      document.getElementById('kpi-mano-obra-deuda').textContent = formatPeso(deudaTotal);
      document.getElementById('kpi-bolsas-hoy').textContent = bolsasHoyTotal.toLocaleString('es-MX');

      document.getElementById('btn-liquidar-todo').style.display = lotesPendientes.length ? 'block' : 'none';
    }

    function renderizarLotesPendientes() {
      const cont = document.getElementById('lista-lotes-pendientes');
      if (!lotesPendientes.length) {
        cont.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; padding:1rem">No hay mano de obra pendiente de liquidar.</p>';
        return;
      }

      cont.innerHTML = lotesPendientes.map(l => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.65rem 0; border-bottom:1px solid var(--border); font-size:0.85rem;">
          <div>
            <strong>${l.empleados?.nombre || 'Operador'}</strong> — ${l.productos?.nombre || 'Producto'}
            <div style="font-size:0.72rem; color:var(--text-muted)">
              ${new Date(l.fecha).toLocaleDateString('es-MX')} · ${l.bolsas_producidas} bolsas x $${parseFloat(l.pago_unitario).toFixed(2)}
            </div>
          </div>
          <div style="text-align:right; display:flex; align-items:center; gap:0.5rem;">
            <strong style="color:#ef4444">${formatPeso(l.total_mano_obra)}</strong>
            <button onclick="cancelarLotePendiente(${l.id})" style="background:#fee2e2; color:#b91c1c; border:none; padding:4px 8px; border-radius:4px; font-size:0.72rem; cursor:pointer;" title="Cancelar este lote">
              🗑️
            </button>
          </div>
        </div>
      `).join('');
    }

    async function cancelarLotePendiente(id) {
      if (!confirm("¿Cancelar y borrar este lote pendiente de pago?")) return;

      try {
        await fetch(`${SUPABASE_URL}/rest/v1/produccion_lotes?id=eq.${id}`, {
          method: 'DELETE',
          headers: { ...headers }
        });

        await cargarLotes();
      } catch (e) {
        alert("Error al cancelar lote: " + e.message);
      }
    }

    async function liquidarManoDeObra() {
      let totalPagar = 0;
      let totalBolsas = 0;
      lotesPendientes.forEach(l => {
        totalPagar += parseFloat(l.total_mano_obra) || 0;
        totalBolsas += parseInt(l.bolsas_producidas) || 0;
      });

      if (!confirm(`¿Liquidar ${formatPeso(totalPagar)} por ${totalBolsas} bolsas empacadas? Esto creará un egreso en Gastos y marcará los lotes como pagados.`)) return;

      try {
        await dbPost('compras_gastos', {
          tipo: 'OPERATIVO',
          categoria: 'Mano de Obra',
          concepto: `Pago destajo empaque (${totalBolsas} bolsas)`,
          total: totalPagar,
          estado: 'COMPLETADO'
        });

        for (const l of lotesPendientes) {
          await dbPatch('produccion_lotes', l.id, { estado_pago: 'PAGADO' });
        }

        alert("✅ Mano de obra liquidada y registrada en Gastos.");
        await cargarLotes();

      } catch (e) {
        alert("Error al liquidar: " + e.message);
      }
    }

    // ─── GESTIÓN DE PERSONAL (CREAR Y EDITAR) ─────────────────────
    function abrirModalEmpleados() {
      document.getElementById('modal-empleados').style.display = 'block';
      limpiarFormEmpleado();
      renderizarListaEmpleados();
    }

    function cerrarModalEmpleados() {
      document.getElementById('modal-empleados').style.display = 'none';
    }

    function renderizarListaEmpleados() {
      const cont = document.getElementById('lista-empleados-contenedor');
      if (!empleados.length) {
        cont.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.8rem">Sin personal registrado.</p>';
        return;
      }

      cont.innerHTML = empleados.map(e => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:0.45rem 0; border-bottom:1px solid var(--border); font-size:0.82rem;">
          <div>
            <strong>${e.nombre}</strong>
            <div style="font-size:0.7rem; color:var(--text-muted)">$${parseFloat(e.pago_por_bolsa).toFixed(2)} por bolsa empacada</div>
          </div>
          <div style="display:flex; gap:0.25rem;">
            <button onclick='editarEmpleado(${JSON.stringify(e)})' style="background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:0.25rem 0.5rem; cursor:pointer; font-size:0.75rem">✏️</button>
            <button onclick="eliminarEmpleado(${e.id})" style="background:#fee2e2; color:#b91c1c; border:none; border-radius:4px; padding:0.25rem 0.5rem; cursor:pointer; font-size:0.75rem">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    function editarEmpleado(e) {
      document.getElementById('emp-id').value = e.id;
      document.getElementById('emp-nombre').value = e.nombre;
      document.getElementById('emp-tarifa').value = e.pago_por_bolsa;

      document.getElementById('emp-form-titulo').textContent = "Editar Trabajador";
      document.getElementById('btn-guardar-emp').textContent = "Actualizar Datos";
      document.getElementById('btn-cancelar-emp').style.display = 'block';
    }

    function limpiarFormEmpleado() {
      document.getElementById('emp-id').value = '';
      document.getElementById('emp-nombre').value = '';
      document.getElementById('emp-tarifa').value = '0.50';

      document.getElementById('emp-form-titulo').textContent = "Personal de Empaque";
      document.getElementById('btn-guardar-emp').textContent = "Guardar Trabajador";
      document.getElementById('btn-cancelar-emp').style.display = 'none';
    }

    async function guardarEmpleado() {
      const id = document.getElementById('emp-id').value;
      const nombre = document.getElementById('emp-nombre').value.trim();
      const tarifa = parseFloat(document.getElementById('emp-tarifa').value) || 0.50;

      if (!nombre) return alert("Ingresa el nombre del trabajador.");

      try {
        if (id) {
          await dbPatch('empleados', id, { nombre, pago_por_bolsa: tarifa });
        } else {
          await dbPost('empleados', { nombre, pago_por_bolsa: tarifa, activo: true });
        }

        limpiarFormEmpleado();
        await cargarEmpleados();
      } catch (e) {
        alert("Error al guardar trabajador: " + e.message);
      }
    }

    async function eliminarEmpleado(id) {
      if (!confirm("¿Eliminar este trabajador?")) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/empleados?id=eq.${id}`, {
          method: 'DELETE',
          headers: { ...headers }
        });
        await cargarEmpleados();
      } catch (e) {
        alert("Error al eliminar trabajador: " + e.message);
      }
    }

    init();
  </script>
</body>

</html>
